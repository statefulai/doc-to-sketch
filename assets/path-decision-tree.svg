<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, sans-serif; }
    .title { font-size: 14px; fill: #374151; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
    .diamond-text { font-size: 13px; fill: #374151; text-anchor: middle; dominant-baseline: central; }
    .path-name { font-size: 14px; fill: #111827; font-weight: 600; text-anchor: middle; }
    .path-desc { font-size: 11px; fill: #6b7280; text-anchor: middle; }
    .branch { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0.5, 8 3.5, 0 6.5" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa" rx="12"/>
  <rect x="1" y="1" width="618" height="358" fill="none" stroke="#e5e7eb" stroke-width="1" rx="12"/>
  <rect x="195" y="15" width="130" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="260" y="33" class="title">你的环境</text>
  <line x1="260" y1="51" x2="260" y2="82" stroke="#d1d5db" stroke-width="1.2" marker-end="url(#arr)"/>
  <polygon points="260,82 318,115 260,148 202,115" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="260" y="115" class="diamond-text">原生出图？</text>
  <line x1="318" y1="115" x2="398" y2="115" stroke="#d1d5db" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="333" y="103" width="30" height="14" rx="2" fill="#fafafa" opacity="0.95"/>
  <text x="348" y="114" class="branch" text-anchor="middle">Yes</text>
  <rect x="400" y="92" width="190" height="46" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="495" y="110" class="path-name">Path A · 直接出图</text>
  <text x="495" y="127" class="path-desc">Codex / Claude Code</text>
  <line x1="260" y1="148" x2="260" y2="182" stroke="#d1d5db" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="245" y="152" width="24" height="14" rx="2" fill="#fafafa" opacity="0.95"/>
  <text x="257" y="163" class="branch" text-anchor="middle">No</text>
  <polygon points="260,182 325,215 260,248 195,215" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="260" y="215" class="diamond-text">配置了 API？</text>
  <line x1="325" y1="215" x2="398" y2="215" stroke="#d1d5db" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="337" y="203" width="30" height="14" rx="2" fill="#fafafa" opacity="0.95"/>
  <text x="352" y="214" class="branch" text-anchor="middle">Yes</text>
  <rect x="400" y="192" width="190" height="46" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="495" y="210" class="path-name">Path B · 在线出图</text>
  <text x="495" y="227" class="path-desc">Cursor / Cline + IMAGE_API</text>
  <line x1="260" y1="248" x2="260" y2="285" stroke="#d1d5db" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="245" y="252" width="24" height="14" rx="2" fill="#fafafa" opacity="0.95"/>
  <text x="257" y="263" class="branch" text-anchor="middle">No</text>
  <rect x="165" y="287" width="190" height="46" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="260" y="305" class="path-name">Path C · 先出规划</text>
  <text x="260" y="322" class="path-desc">所有支持 Skills 的 agent</text>
</svg>